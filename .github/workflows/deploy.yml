name: Deploy Python Application

on:
  workflow_dispatch:
    inputs:
      manual_test_mode:
        description: 'Send immediate Telegram test signal and exit (bypasses window checks)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # All times below are UTC equivalents of IST (Asia/Kolkata = UTC+5:30).
    #
    # IMPORTANT:
    # GitHub scheduled workflows can be delayed more on crowded minute marks (like :00 and :30).
    # To reduce jitter, we intentionally run 2 minutes after each logical slot and use
    # SLOT_TOLERANCE_MINUTES in app logic to still match the intended slot.
    #
    # Logical slot: IST 08:00 AM startup  -> UTC 02:30, trigger at 02:32
    - cron: '32 2 * * *'
    # Logical slots: IST 09:30..15:30 hourly -> UTC 04:00..10:00, trigger at :02
    - cron: '2 4-10 * * *'
    # Logical slot: IST 04:00 PM summary -> UTC 10:30, trigger at 10:32
    - cron: '32 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run application
      # GitHub Secrets are injected as environment variables here.
      # Add each secret in: GitHub repo → Settings → Secrets and variables → Actions
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        ALERT_INTERVAL_MINUTES: ${{ secrets.ALERT_INTERVAL_MINUTES }}
        ALERT_WINDOW_START_TIME: ${{ secrets.ALERT_WINDOW_START_TIME }}
        ALERT_WINDOW_END_TIME: ${{ secrets.ALERT_WINDOW_END_TIME }}
        EXECUTION_START_TIME: ${{ secrets.EXECUTION_START_TIME }}
        EXECUTION_STOP_TIME: ${{ secrets.EXECUTION_STOP_TIME }}
        STARTUP_SIGNAL_TEMPLATE: ${{ secrets.STARTUP_SIGNAL_TEMPLATE }}
        ALERT_MESSAGE_TEMPLATE: ${{ secrets.ALERT_MESSAGE_TEMPLATE }}
        SUMMARY_SUBJECT_TEMPLATE: ${{ secrets.SUMMARY_SUBJECT_TEMPLATE }}
        MANUAL_TEST_MODE: ${{ github.event.inputs.manual_test_mode || secrets.MANUAL_TEST_MODE }}
        MANUAL_TEST_MESSAGE_TEMPLATE: ${{ secrets.MANUAL_TEST_MESSAGE_TEMPLATE }}
        NOTIFY_ON_EACH_RUN_START: ${{ secrets.NOTIFY_ON_EACH_RUN_START }}
        RUN_START_MESSAGE_TEMPLATE: ${{ secrets.RUN_START_MESSAGE_TEMPLATE }}
        DISPLAY_TIMEZONE: ${{ secrets.DISPLAY_TIMEZONE || 'Asia/Kolkata' }}
        SLOT_TOLERANCE_MINUTES: ${{ secrets.SLOT_TOLERANCE_MINUTES || '10' }}
      run: |
        python -u alert_app.py

    - name: Show app log
      if: always()
      run: |
        if [ -f alert.log ]; then
          echo "--- alert.log ---"
          cat alert.log
        else
          echo "alert.log not found"
        fi

    - name: Upload app log artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: alert-log
        path: alert.log
        if-no-files-found: warn

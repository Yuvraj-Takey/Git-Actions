name: Deploy Python Application

on:
  workflow_dispatch:
    inputs:
      manual_test_mode:
        description: 'Send immediate Telegram test signal and exit (bypasses window checks)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # Frequent schedule (UTC) for India market window only (Mon-Fri).
    # IST 09:00-15:30 == UTC 03:30-10:00.
    # Runs every 15 minutes in this window; app sends only due market-hour slots.
    - cron: '30,45 3 * * 1-5'
    - cron: '*/15 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run application
      # GitHub Secrets are injected as environment variables here.
      # Add each secret in: GitHub repo → Settings → Secrets and variables → Actions
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        ALERT_INTERVAL_MINUTES: ${{ secrets.ALERT_INTERVAL_MINUTES || '60' }}
        ALERT_WINDOW_START_TIME: ${{ secrets.ALERT_WINDOW_START_TIME || '09:00' }}
        ALERT_WINDOW_END_TIME: ${{ secrets.ALERT_WINDOW_END_TIME || '15:30' }}
        EXECUTION_START_TIME: ${{ secrets.EXECUTION_START_TIME || '09:00' }}
        EXECUTION_STOP_TIME: ${{ secrets.EXECUTION_STOP_TIME || '15:30' }}
        STARTUP_SIGNAL_TEMPLATE: ${{ secrets.STARTUP_SIGNAL_TEMPLATE }}
        ALERT_MESSAGE_TEMPLATE: ${{ secrets.ALERT_MESSAGE_TEMPLATE }}
        SUMMARY_SUBJECT_TEMPLATE: ${{ secrets.SUMMARY_SUBJECT_TEMPLATE }}
        MANUAL_TEST_MODE: ${{ github.event.inputs.manual_test_mode || secrets.MANUAL_TEST_MODE }}
        MANUAL_TEST_MESSAGE_TEMPLATE: ${{ secrets.MANUAL_TEST_MESSAGE_TEMPLATE }}
        NOTIFY_ON_EACH_RUN_START: 'false'
        RUN_START_MESSAGE_TEMPLATE: ${{ secrets.RUN_START_MESSAGE_TEMPLATE }}
        DISPLAY_TIMEZONE: ${{ secrets.DISPLAY_TIMEZONE || 'Asia/Kolkata' }}
        SLOT_TOLERANCE_MINUTES: ${{ secrets.SLOT_TOLERANCE_MINUTES || '14' }}
        MAX_CATCHUP_MINUTES: ${{ secrets.MAX_CATCHUP_MINUTES || '14' }}
      run: |
        python -u alert_app.py

    - name: Show app log
      if: always()
      run: |
        if [ -f alert.log ]; then
          echo "--- alert.log ---"
          cat alert.log
        else
          echo "alert.log not found"
        fi

    - name: Upload app log artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: alert-log
        path: alert.log
        if-no-files-found: warn



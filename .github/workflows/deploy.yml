name: Deploy SwingSched App

on:
  workflow_dispatch:
    inputs:
      manual_test_mode:
        description: "Send immediate Telegram test signal and exit"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # IST 10:07, 12:38, 14:54 (Mon-Fri)
    - cron: "37 4 * * 1-5"
    - cron: "8 7 * * 1-5"
    - cron: "24 9 * * 1-5"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Log Start Time
        shell: bash
        run: |
          echo "start_utc=$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "start_ist=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"
          echo "event_name=${{ github.event_name }}"
          echo "event_schedule=${{ github.event.schedule }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISPLAY_TIMEZONE: ${{ secrets.DISPLAY_TIMEZONE }}
          MANUAL_TEST_MODE: ${{ github.event.inputs.manual_test_mode }}
          ALERT_MESSAGE_TEMPLATE: ${{ secrets.ALERT_MESSAGE_TEMPLATE }}
          MANUAL_TEST_MESSAGE_TEMPLATE: ${{ secrets.MANUAL_TEST_MESSAGE_TEMPLATE }}
        run: |
          python -u alert_app.py

      - name: Show app log
        if: always()
        run: |
          if [ -f alert.log ]; then
            echo "--- alert.log ---"
            cat alert.log
          else
            echo "alert.log not found"
          fi

      - name: Upload app log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alert-log
          path: alert.log
          if-no-files-found: warn


